<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Connexion – SocialApp</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <a href="index.html" class="logo-small">🌐 SocialApp</a>
      <h2>Connexion</h2>
      <div id="error-msg" class="alert alert-error hidden"></div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="vous@email.com"/>
      </div>
      <div class="form-group">
        <label>Mot de passe</label>
        <input type="password" id="password" placeholder="••••••••"/>
      </div>
      <button class="btn btn-primary btn-full" onclick="login()">Se connecter</button>
      <p class="auth-switch">Pas de compte ? <a href="register.html">S'inscrire</a></p>
    </div>
  </div>
  <script src="js/auth.js"></script>
</body>
</html>
